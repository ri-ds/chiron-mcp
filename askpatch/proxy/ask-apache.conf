# Apache httpd (mod_proxy, mod_proxy_http): serve the Ask server at /ask on Chiron's own
# address. Put these lines in the virtual host that serves Chiron, before any broader
# ProxyPass for /. Under a path prefix (Chiron at /chiron), write /chiron/ask instead.
# The Ask server is at 127.0.0.1:8900 unless ASK_BIND in askpatch/.env says otherwise.
#
# Apache passes a chunked response on as it arrives, so the server-sent events an answer
# streams need no special directive; the timeout just has to outlast an answer.

RedirectMatch 308 ^/ask$ /ask/
ProxyPass        /ask/ http://127.0.0.1:8900/ timeout=300 retry=0
ProxyPassReverse /ask/ http://127.0.0.1:8900/
