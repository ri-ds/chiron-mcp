# nginx: serve the Ask server at /ask on Chiron's own address. Put these two location
# blocks inside the `server` block that serves Chiron (before a catch-all `location /`).
# Under a path prefix (Chiron at /chiron), use /chiron/ask and /chiron/ask/ instead.
# The Ask server is at 127.0.0.1:8900 unless ASK_BIND in askpatch/.env says otherwise.

location = /ask {
    return 308 /ask/;
}

location /ask/ {
    # the trailing slash on proxy_pass strips /ask before the request reaches Ask
    proxy_pass http://127.0.0.1:8900/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # answers stream as server-sent events: no buffering, and time for a long answer
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}
