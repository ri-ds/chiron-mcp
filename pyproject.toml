[project]
name = "chiron-mcp"
version = "0.1.0"
description = "MCP server exposing Chiron (is4r-chiron) cohort discovery to an LLM client"
requires-python = ">=3.12"
dependencies = ["mcp>=2.0.0"]

[project.scripts]
chiron-mcp = "chiron_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chiron_mcp*"]
