<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Chiron</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js">
// Restore the thread last, once render() and offerLoad() are defined.
replay();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js">
// Restore the thread last, once render() and offerLoad() are defined.
replay();
</script>
<style>
  :root {
    --teal-900: #004d40; --teal-700: #00796b; --teal-50: #e0f2f1;
    --purple-900: #4a148c;
    --grey-50: #fafafa; --grey-100: #f5f5f5; --grey-300: #e0e0e0;
    --grey-600: #757575; --grey-800: #424242;
    --ink: #212121; --bg: #ffffff;
    --danger: #b3261e; --danger-bg: #fdecea;
    --font: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.6;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 20px; background: var(--grey-100);
    border-bottom: 1px solid var(--grey-300); flex: none;
  }
  header h1 {
    margin: 0; font-size: 1.15rem; font-weight: 500; color: var(--purple-900);
  }
  header .spacer { flex: 1; }
  .dsname { font-size: 14px; color: var(--grey-800); font-weight: 500; }
  button.clear {
    font-family: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer;
    background: none; border: 1px solid var(--grey-300); border-radius: 4px;
    color: var(--grey-600);
  }
  button.clear:hover { border-color: var(--teal-700); color: var(--teal-900); }
  .who { font-size: 12px; color: var(--grey-600); }

  main { flex: 1; overflow-y: auto; padding: 22px 20px 8px; }
  .thread { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .msg { display: flex; flex-direction: column; gap: 8px; }
  .msg.user .bubble {
    align-self: flex-end; background: var(--teal-700); color: #fff;
    padding: 9px 14px; border-radius: 16px 16px 2px 16px; max-width: 80%;
  }
  .msg.user { align-items: flex-end; }
  .msg.bot .bubble { max-width: 100%; }

  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .step {
    font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
    background: var(--teal-50); color: var(--teal-900);
    padding: 3px 9px; border-radius: 11px; white-space: nowrap;
  }
  .step.working::after { content: " …"; }

  .bubble h1, .bubble h2, .bubble h3 { font-size: 1.05rem; margin: 18px 0 6px; font-weight: 500; }
  .bubble p { margin: 0 0 10px; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble li { margin-bottom: 4px; }
  .bubble strong { font-weight: 600; }
  .bubble code {
    font-family: var(--mono); font-size: .87em;
    background: var(--grey-100); padding: 1px 5px; border-radius: 3px;
  }
  .bubble pre {
    background: var(--grey-50); border: 1px solid var(--grey-300);
    padding: 12px 14px; border-radius: 4px; overflow-x: auto;
  }
  .bubble pre code { background: none; padding: 0; }

  .table-wrap { overflow-x: auto; margin: 0 0 12px; }
  .bubble table { border-collapse: collapse; font-size: 14px; min-width: 320px; }
  .bubble th {
    text-align: left; background: var(--teal-700); color: #fff;
    font-weight: 500; padding: 7px 14px; white-space: nowrap;
  }
  .bubble td {
    padding: 7px 14px; border-bottom: 1px solid var(--grey-300);
    font-variant-numeric: tabular-nums;
  }
  .bubble tbody tr:nth-child(even) { background: var(--grey-50); }

  .chart-box {
    border: 1px solid var(--grey-300); border-radius: 4px;
    padding: 12px; margin: 0 0 12px; background: #fff; height: 300px;
  }

  .chiron-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
  .chiron-link {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--teal-700); color: #fff; text-decoration: none;
    padding: 8px 15px; border-radius: 4px; font-size: 14px; font-weight: 500;
  }
  .chiron-link:hover { background: var(--teal-900); }
  .chiron-link::before { content: "↗"; font-size: 15px; }
  button.chiron-link { border: 0; cursor: pointer; font-family: inherit; }
  button.chiron-link.load { background: #fff; color: var(--teal-900); border: 1px solid var(--teal-700); }
  button.chiron-link.load::before { content: "⇄"; }
  button.chiron-link.load:hover { background: var(--teal-50); }
  button.chiron-link:disabled { opacity: .6; cursor: default; }
  .load-note { font-size: 12px; color: var(--grey-600); margin: -6px 0 12px; }
  .confirm-box {
    border: 1px solid var(--teal-700); border-left-width: 3px; border-radius: 4px;
    padding: 12px 14px; margin: 0 0 12px; background: var(--teal-50);
    display: flex; flex-direction: column; gap: 10px;
  }
  .confirm-box p { margin: 0; font-size: 14px; color: var(--teal-900); }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button {
    font-family: inherit; font-size: 14px; padding: 7px 14px; border-radius: 4px;
    cursor: pointer; border: 1px solid var(--teal-700);
  }
  .confirm-actions .yes { background: var(--teal-700); color: #fff; }
  .confirm-actions .no  { background: #fff; color: var(--teal-900); }

  .err {
    background: var(--danger-bg); color: var(--danger);
    border-left: 3px solid var(--danger); padding: 10px 14px; border-radius: 3px;
    font-size: 14px;
  }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; max-width: 900px; margin: 0 auto 4px; }
  .sugg {
    font-size: 13px; background: #fff; border: 1px solid var(--grey-300);
    color: var(--grey-800); padding: 6px 12px; border-radius: 15px; cursor: pointer;
    font-family: inherit;
  }
  .sugg:hover { border-color: var(--teal-700); color: var(--teal-900); background: var(--teal-50); }

  footer {
    flex: none; padding: 12px 20px 16px; border-top: 1px solid var(--grey-300);
    background: var(--grey-50);
  }
  .composer { max-width: 900px; margin: 10px auto 0; display: flex; gap: 10px; }
  textarea {
    flex: 1; font-family: inherit; font-size: 15px; padding: 11px 14px;
    border: 1px solid var(--grey-300); border-radius: 4px; resize: none;
    min-height: 46px; max-height: 160px; background: #fff; color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--teal-700); outline-offset: -1px; }
  button.send {
    font-family: inherit; font-size: 15px; font-weight: 500; padding: 0 22px;
    background: var(--teal-700); color: #fff; border: 0; border-radius: 4px; cursor: pointer;
  }
  button.send:disabled { background: var(--grey-300); color: var(--grey-600); cursor: default; }

  .empty { color: var(--grey-600); text-align: center; padding: 40px 20px; }
  .empty h2 { font-weight: 400; font-size: 1.2rem; color: var(--grey-800); margin: 0 0 6px; }
</style>
</head>
<body>

<header>
  <h1>Ask Chiron</h1>
  <span class="dsname" id="dsname"></span>
  <span class="spacer"></span>
  <button class="clear" id="clear" type="button" hidden>Clear chat</button>
  <span class="who" id="who"></span>
</header>

<main>
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <h2>Ask a question about this dataset</h2>
      <p>Answers come from Chiron itself, with the real numbers.</p>
    </div>
  </div>
</main>

<footer>
  <div class="suggestions" id="suggestions"></div>
  <div class="composer">
    <textarea id="q" rows="1" placeholder="How many patients have asthma?"></textarea>
    <button class="send" id="send">Ask</button>
  </div>
</footer>

<script>
const thread = document.getElementById('thread');
const empty  = document.getElementById('empty');
const qBox   = document.getElementById('q');
const sendBtn= document.getElementById('send');
const dsName = document.getElementById('dsname');
const clearBtn = document.getElementById('clear');
const who    = document.getElementById('who');
const suggs  = document.getElementById('suggestions');

const SUGGESTIONS = [
  "What are the most common conditions?",
  "How many patients have asthma?",
  "Show the top 10 medications as a chart",
  "Build an asthma cohort and open it in Chiron",
  "What can I filter on?",
];

SUGGESTIONS.forEach(s => {
  const b = document.createElement('button');
  b.className = 'sugg'; b.textContent = s; b.type = 'button';
  b.onclick = () => { qBox.value = s; ask(); };
  suggs.appendChild(b);
});

// The dataset is fixed by the route that embedded this page (/<dataset>/ask), so
// there is nothing to choose here; just name it.
const DATASET = new URLSearchParams(location.search).get('dataset') || '';

fetch('/datasets').then(r => r.json()).then(d => {
  const match = (d.datasets || []).find(x => x.id === DATASET);
  dsName.textContent = match ? match.name : DATASET;
  if (d.identity) who.textContent = 'as ' + d.identity;
  if (d.browser_user && d.browser_user !== d.identity) {
    who.textContent += ' · your workspace: ' + d.browser_user;
  }
}).catch(() => { dsName.textContent = DATASET; });

// --- history -----------------------------------------------------------------
// Following a link into Chiron navigates the whole UI, and coming back reloads this
// iframe from scratch, so the thread has to outlive the page. Kept per dataset.
const HKEY = 'chiron-ask:' + DATASET;
const HMAX = 30;
let history = [];
try { history = JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (_) { history = []; }

function saveHistory() {
  try { localStorage.setItem(HKEY, JSON.stringify(history.slice(-HMAX))); } catch (_) {}
  clearBtn.hidden = history.length === 0;
}

function replay() {
  history.forEach(turn => {
    const userMsg = el('div', 'msg user');
    userMsg.appendChild(el('div', 'bubble', turn.q));
    thread.appendChild(userMsg);

    const botMsg = el('div', 'msg bot');
    const bubble = el('div', 'bubble');
    botMsg.appendChild(bubble);
    thread.appendChild(botMsg);
    if (turn.answer) render(bubble, turn.answer);
    else bubble.appendChild(el('div', 'err', turn.error || 'No answer was recorded.'));
    if (turn.cohort) offerLoad(bubble, turn.cohort);
  });
  if (history.length) { empty.style.display = 'none'; scroll(); }
  clearBtn.hidden = history.length === 0;
}

clearBtn.onclick = () => {
  history = [];
  saveHistory();
  thread.querySelectorAll('.msg').forEach(n => n.remove());
  empty.style.display = '';
};

qBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
qBox.addEventListener('input', () => {
  qBox.style.height = 'auto';
  qBox.style.height = Math.min(qBox.scrollHeight, 160) + 'px';
});
sendBtn.onclick = ask;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function scroll() { document.querySelector('main').scrollTop = 1e9; }

let busy = false;

function ask() {
  const q = qBox.value.trim();
  if (!q || busy) return;
  busy = true; sendBtn.disabled = true;
  empty.style.display = 'none';
  qBox.value = ''; qBox.style.height = 'auto';

  const userMsg = el('div', 'msg user');
  userMsg.appendChild(el('div', 'bubble', q));
  thread.appendChild(userMsg);

  const botMsg  = el('div', 'msg bot');
  const steps   = el('div', 'steps');
  const bubble  = el('div', 'bubble');
  botMsg.append(steps, bubble);
  thread.appendChild(botMsg);
  scroll();

  const working = el('span', 'step working', 'thinking');
  steps.appendChild(working);

  const turn = { q, answer: '', cohort: null, error: '' };
  history.push(turn);

  const url = '/ask?q=' + encodeURIComponent(q) + '&dataset=' + encodeURIComponent(DATASET);
  const src = new EventSource(url);

  src.addEventListener('step', e => {
    working.remove();
    steps.appendChild(el('span', 'step', JSON.parse(e.data)));
    steps.appendChild(working);
    scroll();
  });
  let cohort = null;
  src.addEventListener('cohort', e => {
    try {
      cohort = JSON.parse(e.data);
      turn.cohort = cohort;
      saveHistory();
    } catch (_) {}
  });
  src.addEventListener('answer', e => {
    working.remove();
    turn.answer = JSON.parse(e.data);
    saveHistory();
    render(bubble, turn.answer);
    if (cohort) offerLoad(bubble, cohort);
    scroll();
  });
  src.addEventListener('error', e => {
    working.remove();
    let m = 'Something went wrong.';
    try { m = JSON.parse(e.data); } catch (_) {}
    turn.error = m;
    saveHistory();
    bubble.appendChild(el('div', 'err', m));
    scroll();
  });
  src.addEventListener('done', () => { src.close(); finish(); });
  src.onerror = () => { src.close(); working.remove(); finish(); };

  function finish() { busy = false; sendBtn.disabled = false; qBox.focus(); }
}

// Offer to make the cohort behind this answer the user's live Chiron query.
function offerLoad(target, cohort) {
  let box = target.querySelector('.chiron-links');
  if (!box) { box = el('div', 'chiron-links'); target.appendChild(box); }
  const b = el('button', 'chiron-link load', 'Use as my current query');
  b.type = 'button';
  box.appendChild(b);
  const note = el('div', 'load-note',
    'Replaces the filters open in Chiron with the ones behind this answer.');
  target.appendChild(note);

  // Deliberately not window.confirm(): this page always runs in an iframe inside the
  // Chiron UI, and browsers suppress or block native dialogs in embedded frames, so the
  // button would silently do nothing. Ask inline instead.
  b.onclick = () => {
    if (target.querySelector('.confirm-box')) return;
    const box = el('div', 'confirm-box');
    box.appendChild(el('p', null,
      'Replace the query currently open in Chiron with this one? Your current filters ' +
      'and undo history on this dataset will be lost.'));
    const actions = el('div', 'confirm-actions');
    const yes = el('button', 'yes', 'Replace my query');
    const no = el('button', 'no', 'Cancel');
    yes.type = no.type = 'button';
    actions.append(yes, no);
    box.appendChild(actions);
    note.after(box);
    no.onclick = () => box.remove();
    yes.onclick = () => { box.remove(); doLoad(); };
  };

  async function doLoad() {
    b.disabled = true; b.textContent = 'Loading into Chiron…';
    try {
      const r = await fetch('/load', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cohort),
      });
      const res = await r.json();
      if (res.error) throw new Error(res.error);
      b.textContent = 'Loaded' + (res.browser_user ? ' for ' + res.browser_user : '');
      note.textContent = (res.subject_count != null ? res.subject_count + ' subjects. ' : '') +
        'Opening the filter builder…';
      const dest = res.url || '';
      // Inside the Chiron UI this page is an iframe: navigate the UI itself so the
      // filter builder reloads the new workspace.
      setTimeout(() => { (window.top || window).location.href = dest; }, 600);
    } catch (err) {
      b.disabled = false; b.textContent = 'Use as my current query';
      target.appendChild(el('div', 'err', 'Could not load into Chiron: ' + err.message));
    }
  }
}

function render(target, markdown) {
  // Pull out ```chart blocks before markdown parsing, and render them with Chart.js.
  const charts = [];
  const text = markdown.replace(/```chart\s*([\s\S]*?)```/g, (_, body) => {
    try { charts.push(JSON.parse(body)); return `\n<!--CHART${charts.length - 1}-->\n`; }
    catch (_) { return ''; }
  });

  target.innerHTML = marked.parse(text, { breaks: true });

  // Tables get their own scroll container so a wide one never widens the page.
  target.querySelectorAll('table').forEach(t => {
    const wrap = el('div', 'table-wrap');
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });

  // Links into Chiron become buttons rather than plain links.
  const links = [];
  target.querySelectorAll('a').forEach(a => {
    if (/\/(query|results|reports)(\/|$)/.test(a.getAttribute('href') || '')) links.push(a);
  });
  if (links.length) {
    const box = el('div', 'chiron-links');
    links.forEach(a => {
      const b = el('a', 'chiron-link', a.textContent.trim() || 'Open in Chiron');
      b.href = a.getAttribute('href'); b.target = '_top';
      box.appendChild(b);
      a.replaceWith(el('span'));
    });
    target.appendChild(box);
  }

  // Swap chart placeholders for canvases.
  charts.forEach((spec, i) => {
    const marker = [...target.childNodes].find(
      n => n.nodeType === 8 && n.nodeValue.trim() === 'CHART' + i
    );
    const box = el('div', 'chart-box');
    const canvas = document.createElement('canvas');
    box.appendChild(canvas);
    (marker || target).parentNode === target && marker ? marker.replaceWith(box) : target.appendChild(box);
    const rows = spec.data || [];
    new Chart(canvas, {
      type: spec.type || 'bar',
      data: {
        labels: rows.map(r => r.x),
        datasets: [{
          label: spec.label || '',
          data: rows.map(r => r.y),
          backgroundColor: spec.type === 'doughnut'
            ? ['#00796b','#26a69a','#4db6ac','#80cbc4','#b2dfdb','#4a148c','#7b1fa2','#ab47bc']
            : '#00796b',
          borderColor: '#00796b',
          borderWidth: spec.type === 'line' ? 2 : 0,
          tension: 0.25,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: spec.type === 'doughnut' || !!spec.label } },
        scales: spec.type === 'doughnut' ? {} : { y: { beginAtZero: true } },
      },
    });
  });
}

// Restore the thread last, once render() and offerLoad() are defined.
replay();
</script>
</body>
</html>
