<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Chiron</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --teal-900: #004d40; --teal-700: #00796b; --teal-50: #e0f2f1;
    --purple-900: #4a148c;
    --grey-50: #fafafa; --grey-100: #f5f5f5; --grey-300: #e0e0e0;
    --grey-600: #757575; --grey-800: #424242;
    --ink: #212121; --bg: #ffffff;
    --danger: #b3261e; --danger-bg: #fdecea;
    --font: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.6;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 20px; background: var(--grey-100);
    border-bottom: 1px solid var(--grey-300); flex: none;
  }
  header h1 {
    margin: 0; font-size: 1.15rem; font-weight: 500; color: var(--purple-900);
  }
  header .spacer { flex: 1; }
  button.clear {
    font-family: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer;
    background: none; border: 1px solid var(--grey-300); border-radius: 4px;
    color: var(--grey-600);
  }
  button.clear:hover { border-color: var(--teal-700); color: var(--teal-900); }
  .who { font-size: 12px; color: var(--grey-600); }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 20px 4px; }
  .thread { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px;
           padding-bottom: 4px; }

  .msg { display: flex; flex-direction: column; gap: 8px; }
  .msg.user .bubble {
    align-self: flex-end; background: var(--teal-700); color: #fff;
    padding: 9px 14px; border-radius: 16px 16px 2px 16px; max-width: 80%;
  }
  .msg.user { align-items: flex-end; }
  .msg.bot .bubble { max-width: 100%; }

  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .step {
    font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
    background: var(--teal-50); color: var(--teal-900);
    padding: 3px 9px; border-radius: 11px; white-space: nowrap;
  }
  .step.working::after { content: " …"; }

  .bubble h1, .bubble h2, .bubble h3 { font-size: 1.05rem; margin: 18px 0 6px; font-weight: 500; }
  .bubble p { margin: 0 0 10px; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble li { margin-bottom: 4px; }
  .bubble strong { font-weight: 600; }
  .bubble code {
    font-family: var(--mono); font-size: .87em;
    background: var(--grey-100); padding: 1px 5px; border-radius: 3px;
  }
  .bubble pre {
    background: var(--grey-50); border: 1px solid var(--grey-300);
    padding: 12px 14px; border-radius: 4px; overflow-x: auto;
  }
  .bubble pre code { background: none; padding: 0; }

  .table-wrap { overflow-x: auto; margin: 0 0 12px; }
  .bubble table { border-collapse: collapse; font-size: 14px; min-width: 320px; }
  .bubble th {
    text-align: left; background: var(--teal-700); color: #fff;
    font-weight: 500; padding: 7px 14px; white-space: nowrap;
  }
  .bubble td {
    padding: 7px 14px; border-bottom: 1px solid var(--grey-300);
    font-variant-numeric: tabular-nums;
  }
  .bubble tbody tr:nth-child(even) { background: var(--grey-50); }

  .chart-box {
    border: 1px solid var(--grey-300); border-radius: 4px;
    padding: 12px; margin: 0 0 12px; background: #fff; height: 300px;
  }

  .chiron-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
  .chiron-link {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--teal-700); color: #fff; text-decoration: none;
    padding: 8px 15px; border-radius: 4px; font-size: 14px; font-weight: 500;
  }
  .chiron-link:hover { background: var(--teal-900); }
  .chiron-link::before { content: "↗"; font-size: 15px; }
  button.chiron-link { border: 0; cursor: pointer; font-family: inherit; }
  button.chiron-link.load { background: #fff; color: var(--teal-900); border: 1px solid var(--teal-700); }
  button.chiron-link.load::before { content: "⇄"; }
  button.chiron-link.load:hover { background: var(--teal-50); }
  button.chiron-link:disabled { opacity: .6; cursor: default; }
  .chiron-link.gone { background: #eee; color: #777; cursor: default; }
  .chiron-link.gone::before { content: "✕"; }

  .err {
    background: var(--danger-bg); color: var(--danger);
    border-left: 3px solid var(--danger); padding: 10px 14px; border-radius: 3px;
    font-size: 14px;
  }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; max-width: 900px; margin: 0 auto 4px; }
  .sugg {
    font-size: 13px; background: #fff; border: 1px solid var(--grey-300);
    color: var(--grey-800); padding: 6px 12px; border-radius: 15px; cursor: pointer;
    font-family: inherit;
  }
  .sugg:hover { border-color: var(--teal-700); color: var(--teal-900); background: var(--teal-50); }

  footer {
    flex: none; padding: 10px 20px 12px; border-top: 1px solid var(--grey-300);
    background: var(--grey-50);
  }
  .composer { max-width: 900px; margin: 8px auto 0; display: flex; gap: 10px; }
  textarea {
    flex: 1; font-family: inherit; font-size: 15px; padding: 11px 14px;
    border: 1px solid var(--grey-300); border-radius: 4px; resize: none;
    min-height: 46px; max-height: 160px; background: #fff; color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--teal-700); outline-offset: -1px; }
  button.send {
    font-family: inherit; font-size: 15px; font-weight: 500; padding: 0 22px;
    background: var(--teal-700); color: #fff; border: 0; border-radius: 4px; cursor: pointer;
  }
  button.send:disabled { background: var(--grey-300); color: var(--grey-600); cursor: default; }

  .empty { color: var(--grey-600); text-align: center; padding: 40px 20px; }
  .empty h2 { font-weight: 400; font-size: 1.2rem; color: var(--grey-800); margin: 0 0 6px; }
</style>
</head>
<body>

<header>
  <h1>Ask Chiron</h1>
  <span class="spacer"></span>
  <button class="clear" id="clear" type="button" hidden>Clear chat</button>
  <span class="who" id="who"></span>
</header>

<main>
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <h2>Ask a question about this dataset</h2>
      <p>Answers come from Chiron itself, with the real numbers.</p>
    </div>
  </div>
</main>

<footer>
  <div class="suggestions" id="suggestions" hidden></div>
  <div class="composer">
    <textarea id="q" rows="1" placeholder="How many patients have asthma?"></textarea>
    <button class="send" id="send">Ask</button>
  </div>
</footer>

<script>
const thread   = document.getElementById('thread');
const empty    = document.getElementById('empty');
const qBox     = document.getElementById('q');
const sendBtn  = document.getElementById('send');
const clearBtn = document.getElementById('clear');
const who      = document.getElementById('who');
const suggs    = document.getElementById('suggestions');

// The dataset is fixed by the route that embedded this page (/<dataset>/ask).
const DATASET = new URLSearchParams(location.search).get('dataset') || '';

// What each Chiron tool call means to someone waiting for an answer.
const STEP_LABELS = {
  datasets: 'Checking access', find_concepts: 'Finding variables',
  describe_concept: 'Reading a variable', concept_values: 'Looking up values',
  edit_cohort: 'Building filters', event_rule_options: 'Checking date rules',
  count_cohort: 'Counting patients', run_table: 'Pulling rows', export_table: 'Exporting',
  crosstab: 'Cross-tabulating', breakdown: 'Breaking down', saved_reports: 'Reading reports',
  run_saved_report: 'Running a report', open_in_ui: 'Saving to Chiron',
  update_report: 'Updating the report', delete_report: 'Deleting the report',
};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function scroll() { document.querySelector('main').scrollTop = 1e9; }
// Charts draw, and the starter questions load, after the text is in place, which makes
// the page taller than when the first scroll ran; scroll again once they have.
function settle() { scroll(); requestAnimationFrame(scroll); setTimeout(scroll, 350); }

// --- who, and starter questions for this dataset ------------------------------
// Every call below is a relative URL, so the page works at the Ask server's own root
// (http://localhost:8900/) and behind a proxy that mounts it at a prefix (/ask/).
fetch('datasets?dataset=' + encodeURIComponent(DATASET)).then(r => r.json()).then(d => {
  if (d.identity) who.textContent = 'as ' + d.identity;
  (d.suggestions || []).forEach(s => {
    const b = el('button', 'sugg', s);
    b.type = 'button';
    b.onclick = () => { qBox.value = s; ask(); };
    suggs.appendChild(b);
  });
  suggs.hidden = !(d.suggestions || []).length;
  if (history.length) settle();  // the suggestions just shrank the chat area
}).catch(() => { suggs.hidden = true; });

// --- progress: one chip per kind of step, counted, not one per call -------------
function Progress(box) {
  const chips = new Map();
  let last = null;
  return {
    add(tool) {
      const label = STEP_LABELS[tool] || tool.replace(/_/g, ' ');
      let chip = chips.get(label);
      if (!chip) {
        chip = { n: 0, node: el('span', 'step') };
        chips.set(label, chip);
        box.appendChild(chip.node);
      }
      chip.n += 1;
      chip.node.textContent = chip.n > 1 ? `${label} ×${chip.n}` : label;
      if (last && last !== chip.node) last.classList.remove('working');
      chip.node.classList.add('working');
      last = chip.node;
    },
    done() { box.remove(); },
  };
}

// --- history ---------------------------------------------------------------------
// Following a link into Chiron navigates the whole UI and reloads this iframe, so the
// thread has to outlive the page. Kept per dataset.
const HKEY = 'chiron-ask:' + DATASET;
const TKEY = HKEY + ':thread';
const HMAX = 30;
let history = [];
try { history = JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (_) { history = []; }
// The server's id for this conversation. Sent back with each question so follow-ups
// ("how many of them are women?") continue from the cohorts already built.
let threadId = null;
try { threadId = localStorage.getItem(TKEY); } catch (_) {}
function saveThread(id) {
  threadId = id;
  try { id ? localStorage.setItem(TKEY, id) : localStorage.removeItem(TKEY); } catch (_) {}
}

function saveHistory() {
  try { localStorage.setItem(HKEY, JSON.stringify(history.slice(-HMAX))); } catch (_) {}
  clearBtn.hidden = history.length === 0;
}

function showTurn(bubble, turn) {
  if (turn.answer) render(bubble, turn.answer);
  else bubble.appendChild(el('div', 'err', turn.error || 'No answer was recorded.'));
  if (turn.link) addLink(bubble, turn.link);
  if (turn.cohort) offerLoad(bubble, turn.cohort);
}

function replay() {
  history.forEach(turn => {
    const u = el('div', 'msg user'); u.appendChild(el('div', 'bubble', turn.q));
    const b = el('div', 'msg bot'); const bubble = el('div', 'bubble'); b.appendChild(bubble);
    thread.append(u, b);
    showTurn(bubble, turn);
  });
  if (history.length) { empty.style.display = 'none'; settle(); }
  clearBtn.hidden = history.length === 0;
}

clearBtn.onclick = () => {
  // Also drop the conversation on the server, which deletes its transcript now rather
  // than when it would expire.
  if (threadId) {
    fetch('forget', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread: threadId }),
    }).catch(() => {});
  }
  saveThread(null);
  history = [];
  saveHistory();
  thread.querySelectorAll('.msg').forEach(n => n.remove());
  empty.style.display = '';
};

qBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
qBox.addEventListener('input', () => {
  qBox.style.height = 'auto';
  qBox.style.height = Math.min(qBox.scrollHeight, 160) + 'px';
});
sendBtn.onclick = ask;

// --- asking ------------------------------------------------------------------------
let busy = false;

function ask() {
  const q = qBox.value.trim();
  if (!q || busy) return;
  busy = true; sendBtn.disabled = true;
  empty.style.display = 'none';
  qBox.value = ''; qBox.style.height = 'auto';

  const u = el('div', 'msg user'); u.appendChild(el('div', 'bubble', q));
  const b = el('div', 'msg bot');
  const stepsBox = el('div', 'steps');
  const bubble = el('div', 'bubble');
  b.append(stepsBox, bubble);
  thread.append(u, b);
  scroll();

  const progress = Progress(stepsBox);
  const thinking = el('span', 'step working', 'Thinking');
  stepsBox.appendChild(thinking);

  const turn = { q, answer: '', cohort: null, link: null, error: '' };
  history.push(turn);

  const src = new EventSource(
    'ask?q=' + encodeURIComponent(q) + '&dataset=' + encodeURIComponent(DATASET) +
    (threadId ? '&thread=' + encodeURIComponent(threadId) : ''));

  src.addEventListener('thread', e => { try { saveThread(JSON.parse(e.data)); } catch (_) {} });

  src.addEventListener('step', e => {
    thinking.remove();
    progress.add(JSON.parse(e.data));
    scroll();
  });
  src.addEventListener('link', e => { try { turn.link = JSON.parse(e.data); } catch (_) {} });
  src.addEventListener('deleted', e => { try { retireReport(JSON.parse(e.data)); } catch (_) {} });
  src.addEventListener('cohort', e => { try { turn.cohort = JSON.parse(e.data); } catch (_) {} });
  src.addEventListener('answer', e => {
    turn.answer = JSON.parse(e.data);
    progress.done();          // the answer replaces the progress chips
    showTurn(bubble, turn);
    saveHistory();
    settle();
  });
  src.addEventListener('error', e => {
    // A named error from the server carries data; a bare connection error does not,
    // and is handled by onerror below.
    if (!e.data) return;
    let m = 'Something went wrong.';
    try { m = JSON.parse(e.data); } catch (_) {}
    turn.error = m;
    progress.done();
    bubble.appendChild(el('div', 'err', m));
    saveHistory();
    scroll();
  });
  src.addEventListener('done', () => { src.close(); finish(); });
  src.onerror = () => {
    src.close();
    if (!turn.answer && !turn.error) {
      turn.error = 'The connection to the Ask server was lost.';
      progress.done();
      bubble.appendChild(el('div', 'err', turn.error));
      saveHistory();
    }
    finish();
  };

  function finish() { busy = false; sendBtn.disabled = false; qBox.focus(); }
}

// --- buttons -------------------------------------------------------------------------
function linkBox(target) {
  let box = target.querySelector('.chiron-links');
  if (!box) { box = el('div', 'chiron-links'); target.appendChild(box); }
  return box;
}

function addLink(target, link) {
  const box = linkBox(target);
  if ([...box.querySelectorAll('a')].some(a => a.href === link.url)) return;
  if (link.gone) {
    box.appendChild(el('span', 'chiron-link gone', 'Report deleted'));
    return;
  }
  const a = el('a', 'chiron-link', link.label || 'Open');
  a.href = link.url; a.target = '_top';
  box.appendChild(a);
}

// A report deleted in a later answer must not stay clickable in earlier ones, here or
// after a reload, so both the page and the saved history are updated.
function retireReport(id) {
  const re = new RegExp('/reports/' + Number(id) + '(/|$|\\?)');
  history.forEach(t => { if (t.link && re.test(t.link.url)) t.link.gone = true; });
  saveHistory();
  thread.querySelectorAll('a.chiron-link').forEach(a => {
    if (re.test(a.getAttribute('href') || '')) {
      a.replaceWith(el('span', 'chiron-link gone', 'Report deleted'));
    }
  });
}

function offerLoad(target, cohort) {
  const box = linkBox(target);
  if (box.querySelector('button.load')) return;
  const label = cohort.subject_count != null
    ? 'Query · ' + Number(cohort.subject_count).toLocaleString() : 'Query';
  const b = el('button', 'chiron-link load', label);
  b.type = 'button';
  b.title = 'Load these filters into the Chiron query builder, replacing what is open there';
  box.appendChild(b);

  b.onclick = async () => {
    b.disabled = true; b.textContent = 'Loading…';
    try {
      const r = await fetch('load', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cohort),
      });
      const res = await r.json();
      if (res.error) throw new Error(res.error);
      // Inside Chiron this page is an iframe: navigate the UI itself so the query
      // builder reloads with the new workspace.
      (window.top || window).location.href = res.url;
    } catch (err) {
      b.disabled = false; b.textContent = label;
      target.appendChild(el('div', 'err', err.message));
    }
  };
}

// --- rendering -----------------------------------------------------------------------
function render(target, markdown) {
  // Pull out ```chart blocks before markdown parsing, and draw them with Chart.js.
  const charts = [];
  const text = markdown.replace(/```chart\s*([\s\S]*?)```/g, (_, body) => {
    try { charts.push(JSON.parse(body)); return `\n\n<!--CHART${charts.length - 1}-->\n\n`; }
    catch (_) { return ''; }
  });

  target.innerHTML = marked.parse(text, { breaks: true });

  // Links into Chiron are offered as buttons from the server's own record of what was
  // saved, so any the model wrote into its prose are reduced to plain text.
  target.querySelectorAll('a').forEach(a => {
    if (/\/(query|results|reports)(\/|$|\?)/.test(a.getAttribute('href') || '')) {
      a.replaceWith(document.createTextNode(a.textContent));
    }
  });

  // Tables get their own scroll container so a wide one never widens the page.
  target.querySelectorAll('table').forEach(t => {
    const wrap = el('div', 'table-wrap');
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });

  charts.forEach((spec, i) => {
    const marker = [...target.childNodes].find(
      n => n.nodeType === 8 && n.nodeValue.trim() === 'CHART' + i);
    const box = el('div', 'chart-box');
    const canvas = document.createElement('canvas');
    box.appendChild(canvas);
    if (marker) marker.replaceWith(box); else target.appendChild(box);
    // Two forms: one series as data:[{x,y}], or several as x:[...] with
    // series:[{label, y:[...]}] (a two-variable breakdown, one series per row), which
    // gets a legend so no bar is ever unlabelled.
    const multi = Array.isArray(spec.series) && Array.isArray(spec.x);
    const rows = spec.data || [];
    const palette = ['#00796b', '#7b1fa2', '#f57c00', '#1976d2', '#c2185b', '#689f38',
                     '#5d4037', '#455a64'];
    const datasets = multi
      ? spec.series.map((sr, k) => ({
          label: sr.label || '',
          data: sr.y || [],
          backgroundColor: palette[k % palette.length],
          borderColor: palette[k % palette.length],
          borderWidth: spec.type === 'line' ? 2 : 0,
          tension: 0.25,
        }))
      : [{
          label: spec.label || '',
          data: rows.map(r => r.y),
          backgroundColor: spec.type === 'doughnut' ? palette : '#00796b',
          borderColor: '#00796b',
          borderWidth: spec.type === 'line' ? 2 : 0,
          tension: 0.25,
        }];
    new Chart(canvas, {
      type: spec.type || 'bar',
      data: { labels: multi ? spec.x : rows.map(r => r.x), datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: multi || spec.type === 'doughnut' },
          title: { display: !!spec.title, text: spec.title || '' },
        },
        scales: spec.type === 'doughnut' ? {} : {
          y: { beginAtZero: true,
               title: { display: !!spec.label && !multi, text: spec.label || '' } },
        },
      },
    });
  });
}

// Restore the thread last, once everything above is defined.
replay();
</script>
</body>
</html>
