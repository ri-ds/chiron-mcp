  if (p.deleted && p.deleted.length) b.appendChild(kv([['Reports deleted', p.deleted.join(', ')]]));
  if (p.followups && p.followups.length) {
    const ul = el('ul', 'cd');
    p.followups.forEach(f => {
      const li = el('li');
      li.appendChild(el('span', f.shown ? 'ok-t' : 'no-t', f.shown ? '✓ ' : '✕ '));
      li.append(f.q + (f.shown ? '' : ` (${f.why})`));
      ul.appendChild(li);
    });
    b.appendChild(block('Suggested follow-ups', ul));
  } else b.appendChild(kv([['Suggested follow-ups', 'none written']]));
  (p.charts || []).forEach((ch, i) => {
    const box = el('div');
    box.appendChild(kv([['Chart ' + (i + 1), ch.ok ? ((ch.spec && ch.spec.title) || 'untitled') : 'not valid: dropped from the page', ch.ok ? null : 'warn']]));
    if (ch.issues && ch.issues.length) { const ul = el('ul', 'cd'); ch.issues.forEach(x => ul.appendChild(el('li', 'no-t', x))); box.appendChild(ul); }
    box.appendChild(lazy(ui, 'chart' + i, 'Chart spec', () => pre(ch.ok ? json(ch.spec) : ch.source)));
    b.appendChild(block('Chart', box));
  });
  const td = p.tidy || {};
  if (td.changed) b.appendChild(kv([['Tidied', [
    td.links_removed ? `${td.links_removed} link(s) into Chiron removed` : '',
    td.emails_redacted ? `${td.emails_redacted} email address(es) redacted` : '',
    td.paths_removed ? `${td.paths_removed} file path(s) removed` : '',
  ].filter(Boolean).join(', ') || 'whitespace only']]));
  if (debug && td.before) b.appendChild(lazy(ui, 'tidy', 'The answer before tidying', () => pre(td.before, true)));
}

function debugSection(data, ui) {
  const sec = el('div', 'tr-sec');
  sec.appendChild(el('h4', null, 'Run details'));
  if (data.partial) { sec.appendChild(el('div', 'tr-msg', 'The full run details arrive once the answer is done.')); return sec; }
  const res = data.result || {};
  const pr = data.prompt || {};
  sec.appendChild(kv([
    ['Conversation', el('span', 'mono', data.thread || '')],
    ['Session', pr.resume ? 'resumed (follow-up)' : 'new'],
    ['Claude session id', res.session_id ? el('span', 'mono', res.session_id) : null],
    ['Model', data.model], ['Claude Code', data.claude_version], ['Permission mode', data.permission_mode],
    ['Model turns', res.num_turns], ['API time', res.duration_api_ms != null ? fmtMs(res.duration_api_ms) + (data.followup ? ' (whole conversation)' : '') : null],
    ['Ended because', [res.stop_reason, res.terminal_reason].filter(Boolean).join(' / ')],
    ['Exit code', data.rc],
  ]));
  const add = (key, title, make) => sec.appendChild(lazy(ui, key, title, make));
  add('prompt', 'Prompt sent to the model (question and dataset description)', () => pre(pr.text || '', true));
  add('system', 'System prompt', () => pre(pr.system || '', true));
  add('cmd', 'Claude Code command', () => pre((data.command || []).join(' '), true));
  if (res.usage) add('usage', 'Token usage for this answer', () => pre(json(res.usage)));
  if (res.model_usage) add('musage', 'Per-model usage and cost (whole conversation)', () => pre(json(res.model_usage)));
  if (data.rate_limit) add('rate', 'Rate limit status', () => pre(json(data.rate_limit)));
  if (data.stderr) add('stderr', 'Claude Code stderr', () => pre(data.stderr, true));
  if (data.trace_errors && data.trace_errors.length) add('terr', `Tracing problems (${data.trace_errors.length})`, () => pre(data.trace_errors.join('\n'), true));
  const raw = data.raw || [];
  const skipped = Object.entries(data.raw_skipped || {}).map(([k, v]) => `${num(v)} ${k}`).join(', ');
  add('raw', `Raw stream from Claude Code (${raw.length} events${skipped ? '; not kept: ' + skipped : ''})`, () => {
    const lines = raw.map(r => `[${fmtAt(r.t)}] ${r.type || ''}${r.subtype ? '/' + r.subtype : ''}  ` +
      (r.event ? JSON.stringify(r.event) : r.clipped || ''));
    return pre(lines.join('\n'), true);
  });
  return sec;
}

// Keep the clock moving on an answer that is still coming.
setInterval(() => {
  Object.values(LIVE).forEach(l => { if (!l.tail && l.turn.pending) repaintTrace(l.turn); });
}, 1000);

function setTraceAll(on) {
  TRACE_ALL = on;
  try { localStorage.setItem('chiron-ask:trace-all', on ? '1' : '0'); } catch (_) {}
  $('trace-all').setAttribute('aria-pressed', on ? 'true' : 'false');
  Object.values(TRACE_UI).forEach(u => (u.open = on));
  repaintAllTraces();
}
$('trace-all').onclick = () => setTraceAll(!TRACE_ALL);
$('trace-all').setAttribute('aria-pressed', TRACE_ALL ? 'true' : 'false');

// --- start ---------------------------------------------------------------------------
// Who is asking decides whose conversations to show, so nothing renders until then.
function start(d) {
  ME = (d && d.identity) || null;
  const match = d && (d.datasets || []).find(x => x.id === DATASET);
  DATASET_NAME = (match && match.name) || DATASET || 'this dataset';
  POOL = (d && d.pool) || [];
  FEATURES = (d && d.features) || {};
  load();
  pickStarters();
  renderSidebar();
  renderThread();
  updateComposer();
}
fetch('datasets?dataset=' + encodeURIComponent(DATASET))
  .then(r => r.json()).then(start).catch(() => start(null));
</script>
</body>
