






<h3>Data Summary</h3>
<table class="table">
	{% for key, value in summary_data.items %}
		<tr>
			<td>{{ key }}</td>
			<td>{{ value }}</td>
		</tr>
	{% endfor %}
</table>

{% if datasets %}
	<table class="table table-bordered">
		<thead>
			<tr>
				<th>Longitudinal Data</th>
				<th>Event Count</th>
			</tr>
		</thead>
		<tbody>
			{% for dataset in datasets %}
				<tr>
					<td>{{ dataset.dataset }}</td>
					<td>{{ dataset.record_count }}</td>
				</tr>
			{% endfor %}
		</tbody>
	</table>
{% endif %}
