{% load humanize %}

<ul class="pagination">

    	<li class="page-item {% if not paginator.previous_page %}disabled{% endif %}">
        	<a class="page-link no-underline"
        			href="{% url 'chiron:report' report_id %}?page=1{{ custom_sort_string }}">
        		<i class="fa fa-fast-forward fa-lg fa-rotate-180"></i> first
        	</a>
        </li>
        <li class="page-item {% if not paginator.previous_page %}disabled{% endif %}">
        	<a class="page-link no-underline"
        			href="{% url 'chiron:report' report_id %}?page={{ paginator.previous_page }}{{ custom_sort_string }}">
        		<i class="fa fa-step-forward fa-lg fa-rotate-180"></i> previous
        	</a>
        </li>


    	<li class="page-item active">
        	<div class="page-link">
        		Records
        		<span class="fa-lg">{{ paginator.first_index|intcomma }}</span>
        		-
        		<span class="fa-lg">{{ paginator.last_index|intcomma }}</span>
        		of
        		<span class="fa-lg">{{ paginator.total_records|intcomma }}</span>
        	</div>
    	</li>


    	<li class="page-item {% if not paginator.next_page %}disabled{% endif %}">
    		<a class="page-link no-underline"
        			href="{% url 'chiron:report' report_id %}?page={{ paginator.next_page }}{{ custom_sort_string }}">
        		next <i class="fa fa-step-forward fa-lg"></i>
        	</a>
        </li>
        <li class="page-item {% if not paginator.next_page %}disabled{% endif %}">
        	<a class="page-link no-underline"
        			href="{% url 'chiron:report' report_id %}?page={{ paginator.last_page }}{{ custom_sort_string }}">
        		last <i class="fa fa-fast-forward fa-lg"></i>
        	</a>
        </li>

	</ul>
