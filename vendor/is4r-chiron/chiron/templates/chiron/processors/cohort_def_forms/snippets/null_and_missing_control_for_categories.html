{% load humanize %}

<div class="form-check">
	<input class="form-check-input" type="checkbox"
			value="" id="cat-form-no-value-chk" name="selected_categories[]"
			{% if None in form_options.selected_values %}checked="checked"{% endif %}
		>
	<label class="form-check-label" for="cat-form-no-value-chk" >
		null or missing values for field
		<span id="chiron-null-and-missing-stats" style="display:none;">
			{% if oConcept.collection.is_root_collection %}
				(<span id="chiron-count-subjects-with-missing-values">{{ count_subjects_with_missing_values|intcomma }}</span> subjects)
			{% else %}
				(<span id="chiron-count-missing-values">{{ count_missing_values|intcomma }}</span> entries
				for <span id="chiron-count-subjects-with-missing-values">{{ count_subjects_with_missing_values|intcomma }}</span> subjects)
			{%endif %}
		</span>
	</label>
</div>
