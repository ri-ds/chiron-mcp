# Postgres warehouse for the bundled demo dataset.
#   docker compose up -d
services:
  chiron-mcp-db:
    image: postgres:16
    container_name: chiron-mcp-db
    environment:
      POSTGRES_USER: chiron
      POSTGRES_PASSWORD: chiron
      POSTGRES_DB: chiron
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiron"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - chiron_mcp_pgdata:/var/lib/postgresql/data
volumes:
  chiron_mcp_pgdata:
